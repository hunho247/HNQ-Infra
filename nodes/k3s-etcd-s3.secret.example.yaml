# Secret k3s-etcd-s3 (D13): khoá R2 cho lịch snapshot etcd.
# ⚠️ File này là VÍ DỤ. Bản thật phải kubeseal trước khi commit:
#   kubectl create secret generic k3s-etcd-s3 -n kube-system \
#     --type=etcd.k3s.cattle.io/s3-config-secret \
#     --from-literal=etcd-s3-endpoint=... --dry-run=client -o yaml \
#   | kubeseal --format yaml > secrets/prod/k3s/etcd-s3.yaml
#
# Khi restore trên máy mới (R6) thì truyền thẳng bằng cờ CLI lấy từ recovery
# kit — lúc đó chưa có cluster để đọc Secret.
apiVersion: v1
kind: Secret
metadata:
  name: k3s-etcd-s3
  namespace: kube-system
type: etcd.k3s.cattle.io/s3-config-secret
stringData:
  etcd-s3-endpoint: "<account>.r2.cloudflarestorage.com"
  etcd-s3-bucket: "hnq-etcd-snapshots"
  etcd-s3-region: "auto"
  etcd-s3-access-key: "CHANGEME"
  etcd-s3-secret-key: "CHANGEME"
