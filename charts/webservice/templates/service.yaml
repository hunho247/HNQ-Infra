{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hnq.fullname" . }}
  namespace: {{ include "hnq.namespace" . }}
  labels:
{{ include "hnq.labels" . | trim | indent 4 }}
  annotations:
{{ include "hnq.syncWave" (dict "kind" "Service") | trim | indent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
{{ include "hnq.selectorLabels" . | trim | indent 4 }}
{{- end }}
