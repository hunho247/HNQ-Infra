# storage-postgres — dev
# Chỉ ghi phần KHÁC mặc định của charts/datastore/values.yaml và /env/dev.yaml.
image:
  repository: docker.io/library/postgres
  tag: "17.10"

port: 5432
portName: postgres
secretName: storage-postgres-credentials

persistence:
  size: 10Gi
  mountPath: /var/lib/postgresql/data
  subPath: pgdata
