apiVersion: hnq.dev/v1
kind: ServiceRelease
metadata:
  name: push-notify-v2
spec:
  category: app
  chart: webservice
  # Nạp thêm /registry/apps/push-notify-v2/config/config-<env>.yaml
  config: true
  environments:
    - env: dev
  requiredSecrets:
    - name: push-notify-v2-config
      keys: [DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS, INTERNAL_API_KEY]
    - name: push-notify-v2-firebase
      keys: [service-account.json]
    - name: push-notify-v2-registry
      keys: [.dockerconfigjson]
