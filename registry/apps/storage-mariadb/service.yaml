apiVersion: hnq.dev/v1
kind: ServiceRelease
metadata:
  name: storage-mariadb
spec:
  category: app
  chart: datastore
  # Không có file cấu hình riêng (registry/README.md)
  config: false
  environments:
    # prod bật ở P6, sau khi P5 (Velero + dump hằng giờ) xong — thêm
    # "- env: prod" vào đây là có Application prod, không sửa file nào khác.
    - env: dev
  requiredSecrets:
    - name: storage-mariadb-credentials
      keys: [MARIADB_ROOT_PASSWORD, MARIADB_DATABASE, MARIADB_USER, MARIADB_PASSWORD]
