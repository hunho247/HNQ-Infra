extends: default

rules:
  line-length:
    max: 120
    allow-non-breakable-words: true
    # encryptedData của SealedSecret là base64 một dòng, luôn dài hơn 120 và
    # không xuống dòng được. Các luật yamllint khác vẫn áp dụng cho secrets/;
    # nội dung thì check-secrets.sh kiểm (namespace, tên, danh sách khoá).
    ignore: |
      secrets/
  comments:
    min-spaces-from-content: 1
  truthy:
    # "on:" của GitHub Actions
    check-keys: false
  indentation:
    spaces: consistent
    indent-sequences: consistent
  document-start: disable
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1

ignore: |
  # Template Helm không phải YAML hợp lệ trước khi render — helm lint và
  # render-all.sh lo phần đó.
  charts/*/templates/
  charts/*/charts/
  .render/
  # Cây cũ, giữ để tra cứu cho tới khi migrate xong (xem registry/README.md).
  infra/
  # Repo ứng dụng checkout để tra cứu (.gitignore: .repo/*) — YAML của chúng
  # thuộc CI của chính repo đó, không phải bề mặt YAML của HNQ-Infra.
  .repo/
