apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  namespace: cloudflared
data:
  config.yaml: |
    # ⚠️ Chạy bằng credentials-file, KHÔNG bằng TUNNEL_TOKEN.
    # Với token, cloudflared lấy cấu hình ingress từ dashboard Cloudflare và
    # bỏ qua file này — rule catch-all của D18 sẽ không có tác dụng, mà lại
    # không báo lỗi. Credentials file giữ nguồn sự thật ở Git.
    # Secret cloudflared-credentials: một khoá credentials.json, lấy từ
    #   cloudflared tunnel create hnq   (file ~/.cloudflared/<UUID>.json)
    tunnel: hnq
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      # Một rule catch-all (D18): catch-all không khớp SNI được, và hop này
      # nằm trong cluster — link giữa node đã là WireGuard của Tailscale.
      - service: https://traefik.kube-system.svc.cluster.local:443
        originRequest:
          noTLSVerify: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      nodeSelector:
        hnq.dev/edge: "true"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cloudflared
      containers:
        - name: cloudflared
          image: docker.io/cloudflare/cloudflared:2024.12.2
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config.yaml
            - --no-autoupdate
            - run
          ports:
            - name: metrics
              containerPort: 2000
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared
        - name: creds
          secret:
            secretName: cloudflared-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: cloudflared-metrics
  namespace: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 2000
      targetPort: metrics
  selector:
    app.kubernetes.io/name: cloudflared
