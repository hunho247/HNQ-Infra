apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      nodeSelector:
        hnq.dev/edge: "true"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cloudflared
      containers:
        - name: cloudflared
          image: docker.io/cloudflare/cloudflared:2024.12.2
          # LỆCH KHỎI D18 (docs/PLAN.md) — TẠM THỜI (2026-09-17): tunnel
          # "tunnel-server01" được tạo qua Cloudflare Zero Trust dashboard
          # (token-based), không phải CLI + credentials-file như D18 định.
          # Token method: cloudflared lấy TOÀN BỘ ingress route từ dashboard,
          # bỏ qua mọi config.yaml trong repo — mỗi hostname mới (kể cả đổi
          # sang route Traefik catch-all) phải thêm tay trên dashboard, không
          # còn "1 nơi sự thật là Git" nữa. Xem project memory
          # "cloudflared-token-based-deviation" trước khi đụng vào file này.
          args:
            - tunnel
            - --no-autoupdate
            # Token-mode không có config.yaml nên phải tự mở metrics ra pod IP,
            # nếu không cloudflared nghe 127.0.0.1:<port ngẫu nhiên> và probe
            # /ready trên :2000 bị từ chối → liveness kill pod liên tục.
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cloudflared-metrics
  namespace: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 2000
      targetPort: metrics
  selector:
    app.kubernetes.io/name: cloudflared
