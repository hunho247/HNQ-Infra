# DNS-01 qua Cloudflare (D19): cấp được cả wildcard và không cần mở port 80.
# Token API nằm trong Secret cloudflare-api-token — SealedSecret ở
# secrets/<env>/cert-manager/.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns01-dev
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: life2code.dev@gmail.com
    privateKeySecretRef:
      name: letsencrypt-dns01-dev-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns01-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: life2code.dev@gmail.com
    privateKeySecretRef:
      name: letsencrypt-dns01-prod-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
