apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnel-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tunnel-test
  template:
    metadata:
      labels:
        app: tunnel-test
    spec:
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        - key: hnq.dev/dedicated
          operator: Equal
          value: control-plane
          effect: NoSchedule
      initContainers:
        - name: gen-cert
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              apk add --no-cache openssl >/dev/null
              openssl req -x509 -nodes -newkey rsa:2048 -days 3 \
                -keyout /etc/nginx/tls/tls.key -out /etc/nginx/tls/tls.crt \
                -subj "/CN=server01.l2cteam.work"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          volumeMounts:
            - name: tls
              mountPath: /etc/nginx/tls
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.port }}
              hostPort: {{ .Values.port }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.port }}
            initialDelaySeconds: 2
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tls
              mountPath: /etc/nginx/tls
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: tls
          emptyDir: {}
        - name: conf
          configMap:
            name: tunnel-test-nginx-conf
