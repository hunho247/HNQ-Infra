# Wave -3: phải lên trước mọi thứ, không có nó thì không Secret nào giải mã được.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: platform
  source:
    # Bitnami đã gỡ repo Helm cổ điển này (404) và chuyển hẳn sang OCI —
    # registry-1.docker.io/bitnamicharts/sealed-secrets.
    repoURL: registry-1.docker.io/bitnamicharts
    chart: sealed-secrets
    # Pin tuyệt đối (D23) — Renovate mở PR khi có bản mới.
    targetRevision: 2.20.0
    helm:
      values: |
        fullnameOverride: sealed-secrets-controller
        nodeSelector:
          hnq.dev/role: control-plane
        tolerations:
          - key: hnq.dev/dedicated
            operator: Equal
            value: control-plane
            effect: NoSchedule
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { cpu: 200m, memory: 256Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { selfHeal: true, prune: false }
    syncOptions: [ServerSideApply=true]
