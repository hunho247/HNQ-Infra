# Wave -2: Ingress của service khai cert-manager.io/cluster-issuer, nên CRD và
# controller phải có trước.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: platform
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.16.2
    helm:
      values: |
        crds:
          enabled: true
        nodeSelector:
          hnq.dev/role: control-plane
        tolerations:
          - key: hnq.dev/dedicated
            operator: Equal
            value: control-plane
            effect: NoSchedule
        webhook:
          nodeSelector:
            hnq.dev/role: control-plane
          tolerations:
            - key: hnq.dev/dedicated
              operator: Equal
              value: control-plane
              effect: NoSchedule
        cainjector:
          nodeSelector:
            hnq.dev/role: control-plane
          tolerations:
            - key: hnq.dev/dedicated
              operator: Equal
              value: control-plane
              effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: { selfHeal: true, prune: false }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
# ClusterIssuer tách khỏi chart: wave -1 để chắc chắn CRD đã có.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-issuers
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://github.com/hunho247/HNQ-Infra.git
    targetRevision: main
    path: gitops/manifests/cert-manager-issuers
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: { selfHeal: true, prune: false }
    syncOptions: [ServerSideApply=true]
