{{- if .Values.gorush.enabled }}
{{- $serviceType := (.Values.gorush.service.type | default "ClusterIP") -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "push-notify.gorushFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: gorush
    app.kubernetes.io/name: gorush
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ $serviceType }}
  selector:
    app: gorush
  ports:
    - name: http
      port: {{ .Values.gorush.service.port }}
      targetPort: {{ .Values.gorush.containerPort }}
      {{- if and (or (eq $serviceType "NodePort") (eq $serviceType "LoadBalancer")) .Values.gorush.service.nodePort }}
      nodePort: {{ .Values.gorush.service.nodePort }}
      {{- end }}
{{- end }}
