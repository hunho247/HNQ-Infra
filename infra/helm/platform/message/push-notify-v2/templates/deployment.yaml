              if [ -n "${DB_HOST:-}" ]; then yq eval -i '.database.host = strenv(DB_HOST)' /work/{{ $configKey }}; fi
              if [ -n "${DB_PORT:-}" ]; then yq eval -i '.database.port = strenv(DB_PORT)' /work/{{ $configKey }}; fi
              if [ -n "${DB_NAME:-}" ]; then yq eval -i '.database.name = strenv(DB_NAME)' /work/{{ $configKey }}; fi
