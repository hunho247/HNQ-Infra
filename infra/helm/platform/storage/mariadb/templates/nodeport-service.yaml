{{- if .Values.nodePort.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.nodePort.name | default (printf "%s-nodeport" (include "mariadb.fullname" .)) }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mariadb.labels" . | nindent 4 }}
  {{- with .Values.nodePort.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: NodePort
  selector:
    {{- include "mariadb.selectorLabels" . | nindent 4 }}
  ports:
    - name: mysql
      port: {{ .Values.nodePort.port | default .Values.service.port }}
      targetPort: mysql
      {{- if .Values.nodePort.nodePort }}
      nodePort: {{ .Values.nodePort.nodePort }}
      {{- end }}
{{- end }}
