{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mariadb.secretName" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mariadb.labels" . | nindent 4 }}
type: Opaque
stringData:
  rootPassword: {{ required "mariadb: auth.rootPassword is required when existingSecret is not set" .Values.auth.rootPassword | quote }}
  {{- if .Values.auth.username }}
  password: {{ required "mariadb: auth.password is required when existingSecret is not set" .Values.auth.password | quote }}
  {{- end }}
{{- end }}

