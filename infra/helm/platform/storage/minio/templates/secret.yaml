{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "minio.secretName" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
type: Opaque
stringData:
  rootUser: {{ required "minio: rootUser is required when existingSecret is not set" .Values.rootUser | quote }}
  rootPassword: {{ required "minio: rootPassword is required when existingSecret is not set" .Values.rootPassword | quote }}
{{- end }}
