{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "minio.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hosts.api.host }}
      http:
        paths:
          - path: {{ default "/" .Values.ingress.hosts.api.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "minio.fullname" . }}
                port:
                  name: api
    - host: {{ .Values.ingress.hosts.console.host }}
      http:
        paths:
          - path: {{ default "/" .Values.ingress.hosts.console.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "minio.fullname" . }}
                port:
                  name: console
{{- end }}
