apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opensearch.fullname" . }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "opensearch.labels" . | nindent 4 }}
data:
  opensearch.yml: |
    cluster.name: {{ .Values.config.clusterName | quote }}
    node.name: {{ include "opensearch.fullname" . | quote }}
    network.host: 0.0.0.0
    http.port: {{ .Values.service.port }}
    discovery.type: single-node
    plugins.security.disabled: {{ .Values.config.securityDisabled }}

