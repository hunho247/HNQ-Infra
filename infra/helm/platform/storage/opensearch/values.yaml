global:
  namespace: storage-opensearch
  env: dev

namespace:
  create: false

fullnameOverride: opensearch

image:
  repository: docker.io/opensearchproject/opensearch
  tag: "2.19.4"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 9200
  metricsPort: 9600
  annotations: {}

ingress:
  enabled: false
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  host: opensearch.local
  path: /
  tls:
    enabled: false
    secretName: ""

config:
  clusterName: opensearch
  javaOpts: "-Xms512m -Xmx512m"
  securityDisabled: true

sysctlInit:
  enabled: true
  maxMapCount: 262144
  image:
    repository: docker.io/library/alpine
    tag: "3.23"
    pullPolicy: IfNotPresent

volumePermissions:
  enabled: true
  image:
    repository: docker.io/library/alpine
    tag: "3.23"
    pullPolicy: IfNotPresent

persistence:
  enabled: true
  hostPath: ""
  size: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClass: ""

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true

nodeSelector: {}
tolerations: []
affinity: {}
