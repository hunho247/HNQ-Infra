---
# Credentials secret — required by the app.
# Generate password hash:
#   docker run --rm node:20-alpine node -e \
#     "require('bcryptjs').hash('yourpassword', 12).then(console.log)"
#
# Generate JWT secret:
#   openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: server-control-dev-credentials
  namespace: server-control-dev
type: Opaque
stringData:
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD_HASH: "$2a$12$replacethiswitharealbcrypthash"
  JWT_SECRET: "replace-with-a-random-32-char-string"
---
# SSH keys secret — optional, required only if servers use SSH private key auth.
# Add one key per managed server or a shared key.
