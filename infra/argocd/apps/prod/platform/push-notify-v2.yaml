apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: push-notify-v2-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://gitlab.com/hnq-tech/hnq-infra.git
    targetRevision: main
    path: infra/helm/platform/message/push-notify-v2
    helm:
      releaseName: push-notify-v2
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: push-notify-v2-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
